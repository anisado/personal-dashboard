# Runs the whole stack against a local model instead of a hosted provider:
#   ./scripts/local-ai.sh
# or manually:
#   docker compose -f docker-compose.yml -f docker-compose.local-ai.yml up -d --build
services:
  api:
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen2.5:7b-instruct}
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:0.33.2
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    restart: unless-stopped

volumes:
  ollama-models:
