services:
  api:
    build: ./server
    environment:
      PORT: 4000
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATION_TIMEOUT_MS: ${TRANSLATION_TIMEOUT_MS:-}
      REVIEW_TIMEOUT_MS: ${REVIEW_TIMEOUT_MS:-}
      STEMS_URL: ${STEMS_URL:-}
    extra_hosts:
      # lets the container reach a model server running on the host
      - 'host.docker.internal:host-gateway'
    volumes:
      - dashboard-data:/app/data
    expose:
      - '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped

  # optional: docker compose --profile stems up -d --build
  stems:
    build: ./stems
    profiles: ['stems']
    environment:
      DATA_DIR: /data
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
    volumes:
      - dashboard-data:/data
      - demucs-models:/models
    expose:
      - '8001'
    ports:
      - '${STEMS_PORT:-8001}:8001'
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  dashboard-data:
  demucs-models:
