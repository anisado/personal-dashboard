services:
  api:
    build: ./server
    environment:
      PORT: 4000
      DATA_DIR: /app/data
    volumes:
      - dashboard-data:/app/data
    expose:
      - '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  dashboard-data:
