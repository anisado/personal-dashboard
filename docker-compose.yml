services:
  api:
    build: ./server
    environment:
      PORT: 4000
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      TRANSLATION_TIMEOUT_MS: ${TRANSLATION_TIMEOUT_MS:-}
      REVIEW_TIMEOUT_MS: ${REVIEW_TIMEOUT_MS:-}
    extra_hosts:
      # lets the container reach a model server running on the host
      - 'host.docker.internal:host-gateway'
    volumes:
      - dashboard-data:/app/data
    expose:
      - '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

volumes:
  dashboard-data:
