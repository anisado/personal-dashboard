services:
  api:
    build: ./server
    environment:
      PORT: 4000
      DATA_DIR: /app/data
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - dashboard-data:/app/data
    expose:
      - '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    restart: unless-stopped

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    restart: unless-stopped

  # Optional local model server, started with: docker compose --profile local-ai up -d
  ollama:
    image: ollama/ollama:0.33.2
    profiles:
      - local-ai
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    restart: unless-stopped

volumes:
  dashboard-data:
  ollama-models:
